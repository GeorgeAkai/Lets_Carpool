name: Deploy cron-expire function to Azure

on:
  push:
    branches:
      - main
    paths:
      - azure/cron-expire-function/**
      - .github/workflows/azure-function-cron-deploy.yml
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: cronjob
  AZURE_FUNCTIONAPP_PACKAGE_PATH: azure/cron-expire-function
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into the deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
