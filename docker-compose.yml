services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: carpool
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool -d carpool"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted OSRM routing, used server-side for route-corridor matching.
  # Needs the dataset built first: scripts/osrm-prepare.sh. Serves on :5001
  # (matches Settings.osrm_base_url's default).
  osrm:
    image: osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      - "5001:5000"
    restart: unless-stopped
