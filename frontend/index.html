<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: makes the browser shrink the actual
         viewport when the on-screen keyboard opens (Chrome 108+, iOS Safari
         16.4+), instead of just overlaying it. Without this, our fixed/absolute
         bottom sheets (e.g. the map's search sheet) sit pinned to the old
         viewport height and end up hidden under the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0284c8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <title>Let's Carpool</title>
    <meta name="description" content="Connect with drivers and riders near you. Split gas costs and travel smarter." />

    <!-- App icon / installability -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carpool" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <!-- Theme (light/dark) is owned entirely by next-themes, via
         NeonAuthUIProvider in App.tsx — it manages the `class` on <html>
         itself (including pre-paint, storage key "theme") on every route.
         A second script here previously fought it for control of the same
         element and caused the theme to visibly reset shortly after load. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
