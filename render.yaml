# Render Blueprint for the self-hosted OSRM routing service.
# Set the backend's OSRM_BASE_URL to this service's URL (https://<name>.onrender.com).
services:
  - type: web
    name: carpool-osrm
    runtime: docker
    dockerContext: ./osrm
    dockerfilePath: ./osrm/Dockerfile
    plan: standard   # 2 GB; the Bay Area crop idles at ~350 MB (512 MB plans OOM)
    healthCheckPath: /route/v1/driving/-122.4194,37.7749;-122.4094,37.7849
    envVars:
      - key: PORT
        value: "5000"
